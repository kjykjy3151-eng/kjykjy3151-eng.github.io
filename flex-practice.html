#Before — Flexbox 없이 (기본값)
<div ID="container">
  <div>박스1</div>
  <div>박스2</div>
  <div>박스3</div>
</div>

#After — 부모(container)에 display: flex 적용
<!-- HTML: 박스 3개를 감싸는 부모 -->
<div class="container">
  <div>박스1</div>
  <div>박스2</div>
  <div>박스3</div>
</div>

/* CSS: 부모에게 flex 지시 */
.container {
  display: flex;
  justify-content: center;
  gap: 12px;
}
